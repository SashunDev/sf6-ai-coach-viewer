name: SF6 AI Coach Pages video site

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'demo.html'
      - 'release-smoke.html'
      - 'video-diagnostics.html'
      - 'pages-video-smoke.html'
      - 'pages-integration-smoke.html'
      - 'scripts/build_pages_site.py'
      - 'tests/test_pages_build.py'
      - 'tests/test_coaching_link.py'
      - 'scripts/create_coaching_link.py'
      - 'scripts/publish_coaching_report.py'
      - 'tests/test_publish_report.py'
      - 'tests/test_viewer_pages.cjs'
      - 'scripts/verify_public_match.py'
      - 'tests/test_verify_public_match.py'
      - '.github/workflows/pages-video-site.yml'
  schedule:
    - cron: '42 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish validated Pages site with recent MP4s'
        type: boolean
        required: true
        default: true
      verify_match_id:
        description: 'Optional: verify this published match MP4+JSON (leave empty for routine deploy)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: sf6-coach-pages-live-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check Pages mirror selector and security boundaries
        run: |
          python3 -m unittest discover -s tests -p 'test_pages_build.py' -v
          python3 -m unittest discover -s tests -p 'test_coaching_link.py' -v
          python3 -m unittest discover -s tests -p 'test_publish_report.py' -v
          python3 -m unittest discover -s tests -p 'test_cleanup_release_videos.py' -v
          python3 -m unittest discover -s tests -p 'test_verify_public_match.py' -v
          node --test tests/test_viewer_pages.cjs
      - name: Build with only eligible public MP4s
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/build_pages_site.py --out _site
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    # Keep the public Pages site in sync with main and the dedicated Release.
    # Manual runs may preview without deployment by setting deploy=false.
    if: github.event_name != 'workflow_dispatch' || inputs.deploy == true
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-match:
    # Manual flow for already-uploaded Release assets, including mobile Safari use.
    # Never print a verified short link until BOTH hosted files match Release bytes.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && inputs.verify_match_id != ''
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested match ID before file operations
        env:
          MATCH_ID: ${{ inputs.verify_match_id }}
        run: |
          python3 - <<'PY'
          import os, re
          value = os.environ.get('MATCH_ID', '')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_-]{0,79}', value, re.ASCII):
              raise SystemExit('Invalid match ID')
          print('MATCH ID ACCEPTED:', value)
          PY
      - name: Fetch exact same-ID Release MP4 and JSON
        env:
          GH_TOKEN: ${{ github.token }}
          MATCH_ID: ${{ inputs.verify_match_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sf6-release-match
          gh release download sf6-ai-coach-media --repo "$GITHUB_REPOSITORY" \
            --pattern "${MATCH_ID}.json" --pattern "${MATCH_ID}.mp4" \
            --dir /tmp/sf6-release-match
          test -s "/tmp/sf6-release-match/${MATCH_ID}.json"
          test -s "/tmp/sf6-release-match/${MATCH_ID}.mp4"
      - name: Install ffprobe when runner omits FFmpeg
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffprobe
      - name: Independently verify live Pages MP4 and JSON SHA-256
        env:
          MATCH_ID: ${{ inputs.verify_match_id }}
        run: |
          set -euo pipefail
          python3 scripts/verify_public_match.py --match-id "$MATCH_ID" \
            --report-file "/tmp/sf6-release-match/${MATCH_ID}.json" \
            --video-file "/tmp/sf6-release-match/${MATCH_ID}.mp4"
