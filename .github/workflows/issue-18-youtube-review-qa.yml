name: B3 owner YouTube review integration QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'youtube-*.mjs'
      - 'youtube-privacy.html'
      - 'scripts/build_pages_site.py'
      - 'scripts/build_standalone_report.py'
      - 'tests/test_youtube_*'
      - 'tests/test_viewer_pages.cjs'
      - '.github/workflows/issue-18-youtube-review-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-youtube-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: New owner-library and seek JS modules parse
        run: |
          node --check youtube-library-core.mjs
          node --check youtube-library-cache.mjs
          node --check youtube-seek-core.mjs
          node --check youtube-review.mjs
          node --check youtube-player-controls.mjs
          node --check tests/test_youtube_review_browser.mjs
          python3 -m py_compile scripts/build_pages_site.py scripts/build_standalone_report.py
      - name: Install pinned UI test dependencies
        run: npm ci
      - name: Product integration, owner cache, guest share and workbench mode regressions
        run: npm test
      - name: Legacy Pages build and canonical offline bundle regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_pages_build.py' -v
          python3 -m unittest discover -s tests -p 'test_standalone_report.py' -v
          python3 -m unittest discover -s tests -p 'test_youtube_standalone.py' -v
      - name: Install Japanese fonts for realistic UI geometry and screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-list :lang=ja family | head -n 8
      - name: Synthetic Chromium PR #23 workbench geometry and interaction QA
        env:
          SF6_QA_DIR: ${{ runner.temp }}/sf6-pr23-browser-qa
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          command -v google-chrome
          node --version
          npm run test:browser
      - name: Preserve synthetic browser screenshots, layout measurements and startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr23-workbench-browser-qa
          path: ${{ runner.temp }}/sf6-pr23-browser-qa/
          if-no-files-found: warn
          retention-days: 14
