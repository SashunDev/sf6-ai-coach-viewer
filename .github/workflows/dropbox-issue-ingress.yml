name: SF6 one-attachment encrypted Dropbox replay publish

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - 'scripts/ingest_dropbox_issue.py'
      - 'tests/test_ingest_dropbox_issue.py'
      - '.github/workflows/dropbox-issue-ingress.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ingest_dropbox_issue.py'
      - 'tests/test_ingest_dropbox_issue.py'
      - '.github/workflows/dropbox-issue-ingress.yml'

permissions:
  contents: read

concurrency:
  group: sf6-single-zip-publication
  cancel-in-progress: false

jobs:
  safety-tests:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned sealed-box crypto
        run: python3 -m pip install --only-binary=:all: PyNaCl==1.6.2
      - name: Ensure issue and download validation fail closed
        run: |
          python3 -m unittest discover -s tests -p 'test_ingest_dropbox_issue.py' -v
          python3 -m unittest discover -s tests -p 'test_ingest_match_package.py' -v
          python3 -m unittest discover -s tests -p 'test_publish_match.py' -v

  publish-approved-match:
    if: >-
      github.event_name == 'issues' &&
      github.repository == 'SashunDev/sf6-ai-coach-viewer' &&
      github.event.issue.user.login == 'SashunDev' &&
      startsWith(github.event.issue.title, 'SF6-PUBLISH ')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned sealed-box crypto
        run: python3 -m pip install --only-binary=:all: PyNaCl==1.6.2
      - name: Verify Python ingress and Release validation first
        run: |
          python3 -m unittest discover -s tests -p 'test_ingest_dropbox_issue.py' -v
          python3 -m unittest discover -s tests -p 'test_ingest_match_package.py' -v
          python3 -m unittest discover -s tests -p 'test_publish_match.py' -v
      - name: Ensure H264 inspector is available
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffprobe
      - name: Download source once, validate SHA and publish verified replay
        id: public-link
        env:
          GH_TOKEN: ${{ github.token }}
          SF6_DROPBOX_INGRESS_PRIVATE_KEY_B64: ${{ secrets.SF6_DROPBOX_INGRESS_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if test -z "$SF6_DROPBOX_INGRESS_PRIVATE_KEY_B64"; then
            echo "::error::One-time ingress private-key secret not configured."
            exit 1
          fi
          output="$(python3 scripts/ingest_dropbox_issue.py --event "$GITHUB_EVENT_PATH" --apply)"
          link="$(printf '%s\n' "$output" | tail -n 1 | sed 's/^VERIFIED SF6 PUBLIC REPLAY: //')"
          case "$link" in
            https://sashundev.github.io/sf6-ai-coach-viewer/#id=*) ;;
            *) echo "::error::No fully verified Pages URL"; exit 1;;
          esac
          echo "link=$link" >> "$GITHUB_OUTPUT"
      - name: Record verified Pages link (not temporary source URL)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          MATCH_ISSUE: ${{ github.event.issue.number }}
          VERIFIED_LINK: ${{ steps.public-link.outputs.link }}
        run: |
          gh issue comment "$MATCH_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "VERIFIED: video + JSON public SHA-256 matched GitHub Pages: $VERIFIED_LINK. iPhone Safari real-device playback still requires user check."

      - name: Redact ciphertext and close completed publish issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          MATCH_ISSUE: ${{ github.event.issue.number }}
          VERIFIED_LINK: ${{ steps.public-link.outputs.link }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue edit "$MATCH_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Published and verified SF6 gameplay replay. Short link: $VERIFIED_LINK. Temporary encrypted source removed from current issue body. GitHub edit history may persist."
          gh issue close "$MATCH_ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed

  verify-existing-match:
    # Proof rerun that requires NO Dropbox link and NO second video upload.
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'SashunDev/sf6-ai-coach-viewer' &&
      github.event.issue.user.login == 'SashunDev' &&
      github.event.comment.user.login == 'SashunDev' &&
      github.event.comment.body == 'SF6-VERIFY' &&
      startsWith(github.event.issue.title, 'SF6-PUBLISH ')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Safely derive published match ID from existing issue
        id: match
        env:
          TITLE: ${{ github.event.issue.title }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          s=os.environ['TITLE']
          assert re.fullmatch(r'SF6-PUBLISH [A-Za-z0-9][A-Za-z0-9_-]{0,79}',s,re.ASCII)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as f:
              f.write('match_id='+s.removeprefix('SF6-PUBLISH ')+'\n')
          PY
      - name: Download previously published exact-match assets
        env:
          GH_TOKEN: ${{ github.token }}
          MATCH_ID: ${{ steps.match.outputs.match_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sf6-verify-published
          gh release download sf6-ai-coach-media --repo "$GITHUB_REPOSITORY" \
            --pattern "${MATCH_ID}.json" --pattern "${MATCH_ID}.mp4" \
            --dir /tmp/sf6-verify-published
          test -s "/tmp/sf6-verify-published/${MATCH_ID}.json"
          test -s "/tmp/sf6-verify-published/${MATCH_ID}.mp4"
      - name: Ensure H264 inspector is available
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffprobe
      - name: Independently verify actual GitHub Pages HTTP/MIME/SHA-256
        env:
          MATCH_ID: ${{ steps.match.outputs.match_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_public_match.py \
            --match-id "$MATCH_ID" \
            --report-file "/tmp/sf6-verify-published/${MATCH_ID}.json" \
            --video-file "/tmp/sf6-verify-published/${MATCH_ID}.mp4" \
            --retries 6 --pause 5
      - name: Record independent verify PASS in GitHub Issue
        env:
          GH_TOKEN: ${{ github.token }}
          MATCH_ID: ${{ steps.match.outputs.match_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "INDEPENDENT VERIFIED: GitHub Pages MP4 and JSON both match public Release by full SHA-256, MIME and duration. https://sashundev.github.io/sf6-ai-coach-viewer/#id=${MATCH_ID}. iPhone Safari playback still requires real device confirmation."
