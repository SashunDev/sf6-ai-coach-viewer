name: P4 Match Publisher QA

on:
  pull_request:
    paths:
      - 'scripts/publish_match.py'
      - 'tests/test_publish_match.py'
      - '.github/workflows/publish-match-qa.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/publish_match.py'
      - 'tests/test_publish_match.py'
      - '.github/workflows/publish-match-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (all GitHub mutation and public HTTP mocked)
        run: python3 -m unittest discover -s tests -p 'test_publish_match.py' -v
      - name: Real synthetic H.264 preflight (no public upload)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          mkdir -p /tmp/sf6-match-qa
          ffmpeg -hide_banner -loglevel error -y -f lavfi \
            -i 'color=c=black:s=320x180:r=15' -t 2 -an \
            -c:v libx264 -pix_fmt yuv420p /tmp/sf6-match-qa/synthetic-only.mp4
          python3 - <<'PY'
          import json
          from pathlib import Path
          from sys import path
          path.insert(0,'scripts')
          from publish_match import inspect_video, inspect_report
          folder=Path('/tmp/sf6-match-qa')
          data={
            'schemaVersion':1,
            'match':{'id':'synthetic-only','self':'Alex','opponent':'Terry',
                     'scoreSelf':1,'scoreOpponent':2,'style':'Classic',
                     'durationSec':2.0,'analysisMode':'Review',
                     'mainFocus':'Synthetic QA','mainFocusNote':''},
            'coaching':{'summary':'Synthetic test only','primaryTheme':'QA','secondaryTheme':None},
            'events':[{'id':'E01','round':'ROUND 01','start':.2,'end':1.5,
                       'category':'good','tag':'QA','title':'Synthetic',
                       'short':'Non-game','observed':'Fake frames',
                       'judgment':'Not a real coaching event',
                       'action':'None','success':'No publish'}],
          }
          report=folder/'synthetic-only.json'
          report.write_text(json.dumps(data),encoding='utf-8')
          loaded,n=inspect_report(report,'synthetic-only')
          size=inspect_video(folder/'synthetic-only.mp4','synthetic-only',loaded['match']['durationSec'])
          assert n>0 and size>0
          print('PASS: real H.264 codec, duration and matching report preflight; no GitHub mutation')
          PY
